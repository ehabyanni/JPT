<div class="container1">
  <div class="container2">
    <div class="container3">
      <h2 style="text-align: center">New Comers! Please enter your details.</h2>
      <form
        [formGroup]="registerForm"
        method="post"
        (ngSubmit)="onSubmit()"
        id="formID"
        class="formDiv"
      >
        <div class="nameRegister">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            formControlName="name"
            autocomplete="off"
            [class.is-invalid]="NAME?.invalid && NAME?.touched"
          />
          <div *ngIf="NAME?.errors && NAME?.touched">
            <small *ngIf="NAME?.errors?.['required']">Required</small>
            <small *ngIf="NAME?.errors?.['minlength']">Minimum 3 char</small>
          </div>
        </div>

        <div class="emailRegister">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            formControlName="email"
            autocomplete="off"
            [class.is-invalid]="EMAIL?.invalid && EMAIL?.touched"
          />
          <div *ngIf="EMAIL?.errors && EMAIL?.touched">
            <small *ngIf="EMAIL?.errors?.['required']">Required</small>
            <small *ngIf="EMAIL?.errors?.['email']">Invalid email format</small>
          </div>
        </div>

        <div class="passwordRegister">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="off"
            formControlName="password"
            [class.is-invalid]="PASSWORD?.invalid && PASSWORD?.touched"
          />
          <div *ngIf="PASSWORD?.errors && PASSWORD?.touched">
            <small *ngIf="PASSWORD?.errors?.['required']">Required</small>
            <small *ngIf="PASSWORD?.errors?.['minlength']"
              >Minimum 6 char</small
            >
          </div>
        </div>

        <div class="addressRegister">
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            placeholder="Enter your address"
            formControlName="address"
            autocomplete="off"
            [class.is-invalid]="ADDRESS?.invalid && ADDRESS?.touched"
          />
        </div>

        <div class="phoneRegister">
          <label for="phone">Phone Number</label>
          <input
            type="text"
            id="phone"
            placeholder="Enter your phone"
            formControlName="phone_number"
            autocomplete="off"
            [class.is-invalid]="PHONE?.invalid && PHONE?.touched"
          />
          <div *ngIf="PHONE?.errors && PHONE?.touched">
            <small *ngIf="PHONE?.errors?.['pattern']"
              >Invalid phone number</small
            >
          </div>
        </div>

        <div class="birthdateRegister">
          <label for="birthdate">Date of Birth</label>
          <input
            type="date"
            id="birthdate"
            placeholder="Enter your birthdate"
            formControlName="birthdate"
            autocomplete="off"
            [class.is-invalid]="PHONE?.invalid && PHONE?.touched"
          />
        </div>

        <div class="subBtn">
          <button
            [disabled]="EMAIL?.invalid || PASSWORD?.invalid"
            type="submit"
          >
            Sign up
          </button>
        </div>
      </form>

      <div class="login">
        <p>Already have an Account,</p>
        <a routerLink="/login">Login</a>
      </div>

      <p style="color: red; font-size: 12px; margin-top: 10px; text-align: center;">
        {{ registrationError }}
      </p>
    </div>
  </div>
</div>
